name: Build SpeedLoc APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Encontrar ZIP
        run: |
          ls -la
          unzip -q SpeedLocPessoal_APK_BUILD.zip -d projeto
          find projeto -name settings.gradle.kts

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: |
          cd projeto/SpeedLocPessoal
          gradle --no-daemon :app:assembleDebug

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLocPessoal-APK
          path: projeto/SpeedLocPessoal/app/build/outputs/apk/debug/app-debug.apk
